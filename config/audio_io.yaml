/**:
  ros__parameters:
    backend: alsa
    playback:
      device: "plughw:aic3104"
      rate: 48000
      # 设备输出声道数，不是内容是否立体声。
      # 内部混音始终是单声道：
      #   1 = 以单声道 PCM 打开设备，由 ALSA plughw 适配；不保证只左/右喇叭响。
      #   2 = 把同一个单声道复制到 L/R（dual mono），不是立体声。
      channels: 1
      period_ms: 10
      buffer_ms: 40
    capture:
      enabled: true
      device: ""
      rate: 48000
      channels: 1
      period_ms: 10
      buffer_ms: 40
    stream:
      timeout_ms: 200
    volume: 1.0
    mute: false
    frame_id: "audio"
    log:
      log_level: info
      log_path: ./log
      async: false
